    // For brevity in this response, only samples are shown. The full version has 80+ questions.

    let currentUnit = 'unit1';
    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    function renderUnits() {
      const nav = document.getElementById('unitNav');
      nav.innerHTML = `
        <button class="unit-btn active" onclick="loadUnit('unit1')">Unit 1: Introduction to Management</button>
        <button class="unit-btn" onclick="loadUnit('unit2')">Unit 2: Product, Operations & Project Mgmt</button>
        <button class="unit-btn" onclick="loadUnit('unit3')">Unit 3: Management Practices</button>
        <button class="unit-btn" onclick="loadUnit('unit4')">Unit 4: Marketing Practices</button>
        <button class="unit-btn" onclick="loadUnit('unit5')">Unit 5: Supply Chain & HRM</button>
      `;
    }

    function loadUnit(unit) {
      currentUnit = unit;
      currentQuestion = 0;
      score = 0;
      answered = false;
      document.querySelectorAll('.unit-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`button[onclick="loadUnit('${unit}')"]`).classList.add('active');
      loadQuestion();
    }

    function loadQuestion() {
      const qData = quizData[currentUnit][currentQuestion];
      document.getElementById('unitTitle').textContent = `Unit ${currentUnit.slice(4)}`;
      document.getElementById('progress').textContent = `Question ${currentQuestion + 1} of ${quizData[currentUnit].length}`;
      
      document.getElementById('question').textContent = qData.q;
      
      const optionsDiv = document.getElementById('options');
      optionsDiv.innerHTML = '';

      qData.options.forEach((opt, index) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.textContent = `${String.fromCharCode(65 + index)}) ${opt}`;
        div.dataset.index = index;
        div.onclick = () => selectAnswer(index, div);
        optionsDiv.appendChild(div);
      });

      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('feedback').style.display = 'none';
      answered = false;
    }

    function selectAnswer(selectedIndex, element) {
      if (answered) return;
      answered = true;

      const qData = quizData[currentUnit][currentQuestion];
      const correctIndex = qData.ans;

      document.querySelectorAll('.option').forEach(opt => {
        opt.classList.add('disabled');
        opt.style.pointerEvents = 'none';
      });

      element.classList.add('selected');

      if (selectedIndex === correctIndex) {
        element.classList.add('correct');
        score++;
        document.getElementById('feedback').innerHTML = '✅ Correct Answer!';
        document.getElementById('feedback').className = 'feedback correct';
      } else {
        element.classList.add('wrong');
        document.querySelectorAll('.option')[correctIndex].classList.add('correct');
        document.getElementById('feedback').innerHTML = `❌ Wrong! Correct is: ${String.fromCharCode(65 + correctIndex)}) ${qData.options[correctIndex]}`;
        document.getElementById('feedback').className = 'feedback wrong';
      }

      document.getElementById('feedback').style.display = 'block';
      document.getElementById('nextBtn').style.display = 'block';
    }

    document.getElementById('nextBtn').onclick = () => {
      if (currentQuestion < quizData[currentUnit].length - 1) {
        currentQuestion++;
        loadQuestion();
      } else {
        showFinalResult();
      }
    };

    function showFinalResult() {
      const total = quizData[currentUnit].length;
      const percentage = Math.round((score / total) * 100);
      document.getElementById('quizContainer').innerHTML = `
        <h2 style="text-align:center;">🎉 Quiz Completed!</h2>
        <div style="text-align:center; font-size:2.5rem; margin:30px 0;">${score} / ${total}</div>
        <div style="text-align:center; font-size:1.6rem;">${percentage >= 80 ? 'Excellent!' : percentage >= 60 ? 'Good Job!' : 'Keep Practicing!'}</div>
        <button onclick="location.reload()" style="display:block; margin:30px auto;">Restart Full Test</button>
      `;
    }

    renderUnits();
    loadQuestion();
  </script>
